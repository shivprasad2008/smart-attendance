<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — SmartAttend</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    .user-table {
      width: 100%;
      border-collapse: collapse;
    }
    .user-table th {
      text-align: left;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-60);
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--ink-10);
      font-weight: 500;
    }
    .user-table td {
      padding: var(--sp-4);
      border-bottom: 1px solid var(--ink-10);
      font-size: var(--text-sm);
      vertical-align: middle;
    }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr:hover td { background: var(--surface); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,14,26,0.5);
      backdrop-filter: blur(8px);
      z-index: 1000;
      place-items: center;
    }
    .modal-overlay.open { display: grid; }
    .modal {
      background: var(--card);
      border-radius: var(--r-2xl);
      padding: var(--sp-8);
      width: 90%;
      max-width: 440px;
      box-shadow: var(--shadow-xl);
      animation: scaleIn 0.25s var(--ease-out-expo) both;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 800;
      margin-bottom: var(--sp-6);
    }
    .role-pill-wrap {
      display: flex;
      gap: var(--sp-3);
      margin-top: var(--sp-2);
    }
    .role-pill {
      flex: 1;
      padding: var(--sp-3) var(--sp-4);
      border: 1.5px solid var(--ink-10);
      border-radius: var(--r-md);
      cursor: pointer;
      text-align: center;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-60);
      transition: all var(--t-fast);
    }
    .role-pill.selected {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue);
    }
    .tab-bar {
      display: flex;
      gap: var(--sp-2);
      margin-bottom: var(--sp-6);
      background: var(--surface);
      padding: var(--sp-1);
      border-radius: var(--r-md);
    }
    .tab-btn {
      flex: 1;
      padding: var(--sp-3);
      border: none;
      background: transparent;
      border-radius: calc(var(--r-md) - 4px);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-60);
      transition: all var(--t-fast);
    }
    .tab-btn.active {
      background: var(--card);
      color: var(--blue);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark" style="width:38px;height:38px;background:var(--grad-hero);border-radius:var(--r-md);display:grid;place-items:center;font-size:1.2rem;">⚡</div>
      <span style="font-family:var(--font-display);font-weight:800;font-size:var(--text-md);">SmartAttend</span>
    </div>

    <div style="margin-bottom:var(--sp-2);padding:0 var(--sp-3);">
      <div style="font-size:var(--text-xs);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-60);margin-bottom:var(--sp-3);">Admin Panel</div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" href="#">
        <span class="nav-icon">👥</span>
        <span>User Management</span>
      </a>
      <a class="nav-item" href="#" onclick="showStats()">
        <span class="nav-icon">📊</span>
        <span>Overview</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-meta">
        <div class="avatar" id="sidebarAvatar">S</div>
        <div>
          <div class="user-name" id="sidebarName">Shiv</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
      <button class="btn btn-ghost" style="padding:8px;font-size:1rem;" onclick="doLogout()" title="Logout">↩</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <div class="topbar">
      <div>
        <h1 class="page-title">User Management</h1>
        <div class="topbar-sub" id="today-date"></div>
      </div>
      <div style="display:flex;gap:var(--sp-3);align-items:center;">
        <button class="btn btn-primary" onclick="openAddModal()">
          + Add User
        </button>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="grid-4 anim-fade-up" style="margin-bottom:var(--sp-6);" id="statsRow">
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--blue-light);">👥</div>
        <div class="stat-body"><div class="label">Total Users</div><div class="value" id="statTotal">–</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--teal-light);">👨‍🏫</div>
        <div class="stat-body"><div class="label">Teachers</div><div class="value" id="statTeachers">–</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--violet-light);">🎓</div>
        <div class="stat-body"><div class="label">Students</div><div class="value" id="statStudents">–</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--amber-light);">📅</div>
        <div class="stat-body"><div class="label">Sessions Today</div><div class="value" id="statSessions">–</div></div>
      </div>
    </div>

    <!-- User Table -->
    <div class="card card-pad anim-fade-up delay-2">
      <div class="section-header" style="margin-bottom:var(--sp-5);">
        <div>
          <div class="section-title">All Users</div>
        </div>
        <div class="tab-bar" style="margin-bottom:0;width:auto;flex:none;">
          <button class="tab-btn active" onclick="filterUsers('all', this)">All</button>
          <button class="tab-btn" onclick="filterUsers('teacher', this)">Teachers</button>
          <button class="tab-btn" onclick="filterUsers('student', this)">Students</button>
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table class="user-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Username</th>
              <th>Role</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="4" style="text-align:center;color:var(--ink-60);padding:var(--sp-8);">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Add User Modal -->
<div class="modal-overlay" id="addModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">➕ Add New User</div>

    <div style="display:flex;flex-direction:column;gap:var(--sp-4);">
      <div class="input-group">
        <label class="input-label">Full Name</label>
        <input class="input" id="newName" placeholder="e.g. Rahul Sharma" />
      </div>
      <div class="input-group">
        <label class="input-label">Username</label>
        <input class="input" id="newUsername" placeholder="e.g. rahul01" />
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input class="input" id="newPassword" type="password" placeholder="••••••" />
      </div>
      <div class="input-group">
        <label class="input-label">Role</label>
        <div class="role-pill-wrap">
          <div class="role-pill selected" id="roleStudent" onclick="selectRole('student')">🎓 Student</div>
          <div class="role-pill" id="roleTeacher" onclick="selectRole('teacher')">👨‍🏫 Teacher</div>
        </div>
      </div>
      <div id="modalError" style="display:none;color:var(--rose);font-size:var(--text-sm);font-family:var(--font-mono);"></div>
      <div style="display:flex;gap:var(--sp-3);margin-top:var(--sp-2);">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:2;justify-content:center;" onclick="createUser()">Create User</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:5000/api';
  const token = () => localStorage.getItem('sa_token');

  // Auth guard
  if (!token()) window.location.href = 'login.html';
  const me = JSON.parse(localStorage.getItem('sa_user') || '{}');
  if (me.role !== 'admin') window.location.href = 'login.html';

  // Sidebar
  document.getElementById('sidebarName').textContent = me.name || 'Admin';
  document.getElementById('sidebarAvatar').textContent = (me.name || 'A')[0].toUpperCase();
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {weekday:'short',day:'numeric',month:'short',year:'numeric'});

  let allUsers = [];
  let selectedNewRole = 'student';

  async function apiFetch(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token(), ...(opts.headers || {}) }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function loadUsers() {
    try {
      const data = await apiFetch('/users');
      allUsers = data.users;
      renderUsers(allUsers);
      document.getElementById('statTotal').textContent = allUsers.length;
      document.getElementById('statTeachers').textContent = allUsers.filter(u => u.role === 'teacher').length;
      document.getElementById('statStudents').textContent = allUsers.filter(u => u.role === 'student').length;
    } catch (e) {
      document.getElementById('userTableBody').innerHTML = `<tr><td colspan="4" style="color:var(--rose);text-align:center;padding:var(--sp-8);">${e.message}</td></tr>`;
    }
  }

  async function loadStats() {
    try {
      const health = await fetch('http://localhost:5000/health').then(r => r.json());
      document.getElementById('statSessions').textContent = health.sessions || 0;
    } catch (_) { document.getElementById('statSessions').textContent = '–'; }
  }

  function renderUsers(list) {
    const tbody = document.getElementById('userTableBody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--ink-60);padding:var(--sp-8);">No users yet. Add one!</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(u => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:var(--sp-3);">
            <div class="avatar" style="width:34px;height:34px;font-size:var(--text-xs);flex-shrink:0;">${u.name[0].toUpperCase()}</div>
            <span style="font-weight:600;">${u.name}</span>
          </div>
        </td>
        <td><span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-60);">${u.username}</span></td>
        <td>
          <span class="badge ${u.role === 'teacher' ? 'badge-blue' : 'badge-safe'}">
            ${u.role === 'teacher' ? '👨‍🏫 Teacher' : '🎓 Student'}
          </span>
        </td>
        <td style="text-align:right;">
          <button class="btn btn-ghost" style="padding:6px 12px;font-size:var(--text-xs);color:var(--rose);" onclick="deleteUser('${u.id}', '${u.name}')">
            🗑 Remove
          </button>
        </td>
      </tr>
    `).join('');
  }

  function filterUsers(role, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (role === 'all') renderUsers(allUsers);
    else renderUsers(allUsers.filter(u => u.role === role));
  }

  function selectRole(role) {
    selectedNewRole = role;
    document.getElementById('roleStudent').classList.toggle('selected', role === 'student');
    document.getElementById('roleTeacher').classList.toggle('selected', role === 'teacher');
  }

  function openAddModal() {
    document.getElementById('newName').value = '';
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('modalError').style.display = 'none';
    selectRole('student');
    document.getElementById('addModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('addModal').classList.remove('open');
  }

  async function createUser() {
    const name     = document.getElementById('newName').value.trim();
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value.trim();
    const errEl    = document.getElementById('modalError');

    if (!name || !username || !password) {
      errEl.textContent = '⚠️ All fields are required.';
      errEl.style.display = 'block';
      return;
    }

    try {
      await apiFetch('/users', {
        method: 'POST',
        body: JSON.stringify({ name, username, password, role: selectedNewRole })
      });
      closeModal();
      await loadUsers();
    } catch (e) {
      errEl.textContent = '⚠️ ' + e.message;
      errEl.style.display = 'block';
    }
  }

  async function deleteUser(id, name) {
    if (!confirm(`Remove user "${name}"? This cannot be undone.`)) return;
    try {
      await apiFetch('/users/' + id, { method: 'DELETE' });
      await loadUsers();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  function doLogout() {
    localStorage.removeItem('sa_token');
    localStorage.removeItem('sa_user');
    window.location.href = 'login.html';
  }

  // Init
  loadUsers();
  loadStats();
</script>
</body>
</html>
