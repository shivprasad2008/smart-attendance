<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SmartAttend</title>
  <link rel="stylesheet" href="../css/tokens.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    body {
      background: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      overflow: hidden;
    }

    /* Background Grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,91,246,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,91,246,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Glow Orbs */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: orbFloat 8s ease-in-out infinite;
    }

    .glow-1 {
      width: 500px; height: 500px;
      background: rgba(59,91,246,0.2);
      top: -150px; left: -100px;
    }

    .glow-2 {
      width: 400px; height: 400px;
      background: rgba(124,58,237,0.15);
      bottom: -100px; right: -80px;
      animation-delay: -3s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(30px, -30px); }
    }

    /* Login Card */
    .login-card {
      width: 100%;
      max-width: 420px;
      margin: var(--sp-6);
      position: relative;
      z-index: 10;
      animation: fadeUp 0.6s var(--ease-out-expo) both;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--sp-8);
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 800;
      color: #fff;
      margin-bottom: var(--sp-6);
    }

    .logo-mark {
      width: 46px; height: 46px;
      background: var(--grad-hero);
      border-radius: var(--r-md);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      box-shadow: var(--shadow-blue);
    }

    .login-tagline {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.5);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }

    .login-body {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: var(--r-2xl);
      padding: var(--sp-8);
    }

    .login-body .input-label {
      color: rgba(255,255,255,0.6);
    }

    .login-body .input {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
      color: #fff;
    }

    .login-body .input::placeholder { color: rgba(255,255,255,0.3); }

    .login-body .input:focus {
      border-color: var(--blue);
      background: rgba(59,91,246,0.08);
    }

    /* Role Selector */
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
      margin-bottom: var(--sp-5);
    }

    .role-btn {
      padding: var(--sp-4);
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: var(--r-lg);
      cursor: pointer;
      text-align: center;
      transition: all var(--t-fast) var(--ease-in-out);
      color: rgba(255,255,255,0.6);
    }

    .role-btn.selected {
      background: var(--blue-light);
      border-color: var(--blue);
      color: var(--blue);
    }

    .role-btn .role-emoji {
      font-size: 1.8rem;
      display: block;
      margin-bottom: var(--sp-1);
    }

    .role-btn .role-name {
      font-size: var(--text-xs);
      font-weight: 600;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-login {
      width: 100%;
      justify-content: center;
      padding: var(--sp-4);
      font-size: var(--text-base);
      border-radius: var(--r-md);
      background: var(--grad-hero);
      color: #fff;
      font-weight: 700;
      font-family: var(--font-display);
      border: none;
      cursor: pointer;
      transition: all var(--t-base) var(--ease-out-expo);
      box-shadow: var(--shadow-blue);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 48px rgba(59,91,246,0.4);
    }

    .login-footer {
      text-align: center;
      margin-top: var(--sp-5);
      font-size: var(--text-xs);
      color: rgba(255,255,255,0.4);
      font-family: var(--font-mono);
    }

    .forgot-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      transition: color var(--t-fast);
    }
    .forgot-link:hover { color: #fff; }

    /* Feature badges */
    .feature-strip {
      display: flex;
      justify-content: center;
      gap: var(--sp-4);
      margin-top: var(--sp-6);
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      color: rgba(255,255,255,0.35);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <div class="logo-mark">⚡</div>
        SmartAttend
      </div>
      <div class="login-tagline">QR-based Attendance Management System</div>
    </div>

    <div class="login-body">
      <div style="margin-bottom: var(--sp-5);">
        <div class="input-label" style="margin-bottom: var(--sp-3);">I am a</div>
        <div class="role-grid">
          <div class="role-btn" id="roleStudent" onclick="selectRole('student')">
            <span class="role-emoji">🎓</span>
            <span class="role-name">Student</span>
          </div>
          <div class="role-btn selected" id="roleTeacher" onclick="selectRole('teacher')">
            <span class="role-emoji">👨‍🏫</span>
            <span class="role-name">Teacher</span>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: var(--sp-4);">
        <div class="input-group">
          <label class="input-label">Username</label>
          <input class="input" type="text" placeholder="e.g. shiv" id="emailInput"/>
        </div>

        <div class="input-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="input-label">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <input class="input" type="password" placeholder="••••••••" id="passInput"/>
        </div>

        <button class="btn-login" onclick="doLogin()">
          <span>Sign In</span> <span>→</span>
        </button>
      </div>
    </div>

    <div class="feature-strip">
      <div class="feature-chip">🔒 JWT Auth</div>
      <div class="feature-chip">⚡ QR Sessions</div>
      <div class="feature-chip">📊 Analytics</div>
    </div>

    <div class="login-footer">
      Smart Attendance System v2.0 · Secure & Private
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';

    // Hide role selector — role comes from server
    document.querySelector('.role-grid').parentElement.style.display = 'none';

    async function doLogin() {
      const username = document.getElementById('emailInput').value.trim();
      const pass     = document.getElementById('passInput').value.trim();
      if (!username || !pass) { showError('Please enter username and password.'); return; }

      const btn = document.querySelector('.btn-login');
      btn.disabled = true;
      btn.innerHTML = '<span>Signing in…</span>';

      try {
        const res  = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: pass })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('sa_token', data.token);
        localStorage.setItem('sa_user', JSON.stringify(data.user));

        const role = data.user.role;
        if (role === 'admin')   window.location.href = 'admin-dashboard.html';
        else if (role === 'teacher') window.location.href = 'teacher-dashboard.html';
        else                         window.location.href = 'student-dashboard.html';
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span> <span>→</span>';
      }
    }

    function showError(msg) {
      let el = document.getElementById('loginError');
      if (!el) {
        el = document.createElement('div');
        el.id = 'loginError';
        Object.assign(el.style, {
          background: 'rgba(240,78,110,0.15)', border: '1px solid rgba(240,78,110,0.3)',
          color: '#F04E6E', padding: '10px 14px', borderRadius: '10px',
          fontSize: '13px', fontFamily: 'DM Sans, sans-serif', marginTop: '12px'
        });
        document.querySelector('.btn-login').insertAdjacentElement('afterend', el);
      }
      el.textContent = '⚠️ ' + msg;
      setTimeout(() => el && el.remove(), 4000);
    }

    // Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // Auto-redirect if already logged in
    const existing = localStorage.getItem('sa_token');
    if (existing) {
      const user = JSON.parse(localStorage.getItem('sa_user') || 'null');
      if (user) {
        if (user.role === 'admin') window.location.href = 'admin-dashboard.html';
        else if (user.role === 'teacher') window.location.href = 'teacher-dashboard.html';
        else window.location.href = 'student-dashboard.html';
      }
    }
  </script>
</body>
</html>
